version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vide-grenier-web
    ports:
      - "8080:80"
    env_file:
      - ./prod.env
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - PHP_INI_DIR=/usr/local/etc/php
    volumes:
      - ./public/storage:/var/www/html/public/storage
      - ./logs:/var/www/html/logs
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - vide-grenier-network

  db:
    image: mysql:8.0
    container_name: vide-grenier-db
    ports:
      - "3307:3306"
    env_file:
      - ./prod.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: videgrenier
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql
    restart: unless-stopped
    networks:
      - vide-grenier-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
    driver: local

networks:
  vide-grenier-network:
    driver: bridge
