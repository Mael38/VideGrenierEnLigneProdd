{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block head %}
<style>
    .login-wraper {
        max-width: 1200px;
        margin: 0 auto;
        position: relative;
        background-color: #f5f5f5;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
        display: flex;
    }
    
    .login-wraper .hidden-xs {
        flex: 1;
    }
    
    .login-wraper .hidden-xs img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    .login-window {
        flex: 1;
        background: white;
        padding: 20px;
        position: relative !important;
        margin: 0 !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
    }
    
    .banner-text {
        position: absolute;
        top: 100px;
        left: 50px;
        color: white;
        text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        text-align: left;
    }
    
    .banner-text .color-active {
        color: #ea2c5a;
    }
    
    .banner-text .color-b1 {
        color: #84d4e6;
    }
    
    .bg-image {
        background-color: #f9f9f9;
        padding: 30px 0;
    }
    
    @media (max-width: 768px) {
        .login-wraper {
            flex-direction: column;
        }
        
        .login-window {
            width: 100% !important;
        }
    }
    
    .btn-cv1 {
        background: #ea2c5a;
        color: white;
        border: none;
        padding: 8px 25px;
        border-radius: 3px;
        font-weight: 500;
    }
    
    .btn-cv1:hover {
        background: #c4204a;
        color: white;
    }
    
    /* Amélioration des styles de formulaire */
    .form-control:focus {
        border-color: #ea2c5a;
        box-shadow: 0 0 0 0.2rem rgba(234, 44, 90, 0.25);
    }
    
    .l-head {
        font-size: 24px;
        font-weight: 500;
        margin-bottom: 20px;
        color: #333;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
</style>
{% endblock %}

{% block body %}
<div class="container-fluid bg-image">
    <div class="row">
        <div class="login-wraper">
            <div class="hidden-xs">
                <img src="/images/account.jpg" alt="">
            </div>
            <div class="banner-text hidden-xs">
                <div class="line"></div>
                <div class="b-text">
                    Des <span class="color-active">centaines<br> </span> <span class="color-b1">d'articles vous
                </span>attendent
                </div>
                <div class="overtext">
                    Plus de 15 articles ajoutés quotidiennement
                </div>
            </div>
            <div class="login-window">
                <div class="l-head">
                    Créer un compte
                </div>
                <div class="l-form">
                    <form method="post" action="">
                        <div class="form-group">
                            <label for="username">Nom d'utilisateur</label>
                            <input type="text" class="form-control" id="username" name="username"
                                   placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputEmail1">Email</label>
                            <input type="email" class="form-control" id="exampleInputEmail1" name="email"
                                   placeholder="exemple@gmail.com">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1">Mot de passe</label>
                            <input type="password" class="form-control" id="exampleInputPassword1"
                                   placeholder="**********" name="password">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword2">Votre mot de passe à nouveau</label>
                            <input type="password" class="form-control" id="exampleInputPassword2"
                                   placeholder="**********" name="password-check">
                        </div>
                        <div class="row">
                            <div class="col-lg-7"><button type="submit" name="submit" class="btn btn-cv1">Valider
                            </button></div>
                            <div class="hidden-xs">
                                <div class="col-lg-1 ortext">ou</div>
                                <div class="col-lg-4 signuptext"><a href="login.html">Connexion</a></div>
                            </div>
                        </div>
                        <div class="visible-xs text-center mt-30">
                            <span class="signuptext"><a href="/login">Se connecter</a></span>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
