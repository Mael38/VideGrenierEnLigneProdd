version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: vide-grenier-web-prod
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_NAME=videgrenierenligne
      - DB_USER=root
      - DB_PASSWORD=653rag9T
      - SHOW_ERRORS=false
      - ENVIRONMENT=production
    volumes:
      - ./public/storage:/var/www/html/public/storage
      - ./logs:/var/www/html/logs
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - vide-grenier-network

  db:
    image: mysql:8.0
    container_name: vide-grenier-db-prod
    environment:
      MYSQL_ROOT_PASSWORD: 653rag9T
      MYSQL_DATABASE: videgrenierenligne
      MYSQL_USER: videgrenier
      MYSQL_PASSWORD: 653rag9T
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - ./sql/import.sql:/docker-entrypoint-initdb.d/import.sql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - vide-grenier-network
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data_prod:
    driver: local

networks:
  vide-grenier-network:
    driver: bridge
